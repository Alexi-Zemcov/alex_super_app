name: vocal_warmup_app
description: Shell application that launches the vocal warmup module directly.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  app_theme: ^0.1.0
  go_router: ^17.1.0
  provider: ^6.1.5+1
  scoped_di: ^0.1.0
  shared_preferences: ^2.5.3
  vocal_warmup: ^0.1.0

dev_dependencies:
  build_runner: ^2.13.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.2.1
  midi_playback: ^0.1.0
  music_theory: ^0.1.0

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
